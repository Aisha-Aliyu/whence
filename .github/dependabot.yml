# Dependabot keeps dependencies current.
# Docs: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# Python (uv) and web (npm) entries arrive with the code that needs them.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # New releases wait 7 days before Dependabot proposes them. Security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  # The dev container's features (Node, Docker, GitHub CLI) in .devcontainer/devcontainer.json.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      dev-container-features:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5

  # The dev container's base images (Python and uv) in .devcontainer/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      dev-container-images:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 5
