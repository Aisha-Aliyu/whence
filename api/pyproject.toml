[project]
name = "whence-api"
version = "0.1.0"
description = "The Whence API: answers from a team's own documents, with citations."
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.164.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic-settings==2.16.3",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
# Every version in the lockfile, dependencies of dependencies included, was
# published before this date, at least 7 days before the lockfile was made.
# Move it forward on purpose, in a reviewed pull request.
exclude-newer = "2026-11-18T13:22:17Z"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is how pytest checks

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
