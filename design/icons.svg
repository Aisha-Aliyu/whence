<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    Whence icons. 24px grid, 1.75px stroke, round ends, drawn in the text color.
    Use: <svg class="icon" aria-hidden="true"><use href="/icons.svg#search"/></svg>
    next to a visible label, or give the button an aria-label.
  -->
  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.5 15.5L20 20"/>
  </symbol>
  <symbol id="document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h7l4 4v14H7z"/>
    <path d="M14 3v4h4M10 12h5M10 16h5"/>
  </symbol>
  <symbol id="upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>
  </symbol>
  <symbol id="citation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5H6v14h3M15 5h3v14h-3"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
  </symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7.5V13M12 16.5v.01"/>
  </symbol>
  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M4 12h16M4 17h16"/>
  </symbol>
</svg>
